const quizForm = document.getElementById("moduleQuiz");
const quizResult = document.getElementById("quizResult");
const quizScore = document.getElementById("quizScore");
const quizSummary = document.getElementById("quizSummary");
const quizFeedback = document.getElementById("quizFeedback");
const nextModule = document.getElementById("nextModule");
const retryQuiz = document.getElementById("retryQuiz");

let currentLang = "id";

function getSavedLanguage() {
  try {
    return localStorage.getItem("desk_language") === "en" ? "en" : "id";
  } catch (error) {
    return "id";
  }
}

function renderLessons(t) {
  const container = document.getElementById("lessonContent");
  container.replaceChildren();

  t.lessons.forEach(lesson => {
    const section = document.createElement("section");
    section.className = "module-section";

    const eyebrow = document.createElement("span");
    eyebrow.className = "module-eyebrow";
    eyebrow.textContent = lesson.eyebrow;
    section.appendChild(eyebrow);

    const heading = document.createElement("h2");
    heading.textContent = lesson.title;
    section.appendChild(heading);

    if (lesson.paragraphs) {
      lesson.paragraphs.forEach(text => {
        const p = document.createElement("p");
        p.textContent = text;
        section.appendChild(p);
      });
    }

    if (lesson.list) {
      const list = document.createElement("ul");
      list.className = "module-list";

      lesson.list.forEach(item => {
        const li = document.createElement("li");

        if (Array.isArray(item)) {
          const strong = document.createElement("strong");
          strong.textContent = item[0];
          li.append(strong, document.createTextNode(item[1]));
        } else {
          li.textContent = item;
        }

        list.appendChild(li);
      });

      section.appendChild(list);
    }

    if (lesson.note) {
      const note = document.createElement("div");
      note.className = "module-note";

      const strong = document.createElement("strong");
      strong.textContent = lesson.noteTitle;

      const p = document.createElement("p");
      p.textContent = lesson.note;

      note.append(strong, p);
      section.appendChild(note);
    }

    container.appendChild(section);
  });
}

function renderQuiz(t) {
  const container = document.getElementById("quizQuestions");
  container.replaceChildren();

  t.quiz.forEach((question, index) => {
    const fieldset = document.createElement("fieldset");
    fieldset.className = "quiz-question";

    const legend = document.createElement("legend");
    legend.textContent = `${index + 1}. ${question.question}`;
    fieldset.appendChild(legend);

    question.options.forEach((option, optionIndex) => {
      const label = document.createElement("label");
      label.className = "quiz-option";

      const input = document.createElement("input");
      input.type = "radio";
      input.name = `q${index + 1}`;
      input.value = ["a", "b", "c"][optionIndex];
      input.required = optionIndex === 0;

      label.append(input, document.createTextNode(" " + option));
      fieldset.appendChild(label);
    });

    container.appendChild(fieldset);
  });
}

function setLanguage(language) {
  currentLang = language === "en" ? "en" : "id";
  const t = content[currentLang];

  document.documentElement.lang = currentLang;

  try {
    localStorage.setItem("desk_language", currentLang);
  } catch (error) {}

  document.querySelectorAll("[data-language]").forEach(button => {
    button.classList.toggle("active", button.dataset.language === currentLang);
  });

  document.getElementById("backLink").textContent = t.back;
  document.getElementById("bottomBackLink").textContent = t.bottomBack;
  document.getElementById("heroDescription").textContent = t.description;
  document.getElementById("tagFree").textContent = t.free;
  document.getElementById("tagLevel").textContent = t.level;
  document.getElementById("tagQuestions").textContent = t.questions;

  document.getElementById("quizEyebrow").textContent = t.quizEyebrow;
  document.getElementById("quizTitle").textContent = t.quizTitle;
  document.getElementById("quizDescription").textContent = t.quizDescription;
  document.getElementById("submitQuiz").textContent = t.submit;
  retryQuiz.textContent = t.retry;
  nextModule.textContent = t.next;

  renderLessons(t);
  renderQuiz(t);

  quizResult.style.display = "none";
  nextModule.hidden = true;
  quizFeedback.replaceChildren();
}

document.querySelectorAll("[data-language]").forEach(button => {
  button.addEventListener("click", () => {
    setLanguage(button.dataset.language);
  });
});

quizForm.addEventListener("submit", function(event) {
  event.preventDefault();

  const t = content[currentLang];
  const formData = new FormData(quizForm);
  let score = 0;

  quizFeedback.replaceChildren();

  t.quiz.forEach((question, index) => {
    const key = `q${index + 1}`;
    const selected = formData.get(key);
    const isCorrect = selected === question.answer;

    if (isCorrect) score++;

    const feedback = document.createElement("div");
    feedback.className = "quiz-feedback";

    const heading = document.createElement("strong");
    heading.textContent = `${index + 1}. ${isCorrect ? t.correct : t.incorrect}`;

    const explanation = document.createElement("p");
    explanation.textContent = isCorrect ? question.correct : question.incorrect;

    feedback.append(heading, explanation);
    quizFeedback.appendChild(feedback);
  });

  const passed = score >= 4;

  quizScore.textContent = t.score + score + "/5 (" + (score * 20) + "%)";
  quizScore.className = passed ? "quiz-pass" : "quiz-retry";
  quizSummary.textContent = passed ? t.passed : t.failed;

  nextModule.hidden = !passed;
  quizResult.style.display = "block";

  quizResult.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

  quizResult.focus();
});

retryQuiz.addEventListener("click", function() {
  quizForm.reset();
  quizResult.style.display = "none";
  nextModule.hidden = true;
  quizFeedback.replaceChildren();

  document.getElementById("module-quiz").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
});

window.addEventListener("storage", function(event) {
  if (event.key === "desk_language") {
    setLanguage(event.newValue === "en" ? "en" : "id");
  }
});

setLanguage(getSavedLanguage());
</script>

</body>
</html>
